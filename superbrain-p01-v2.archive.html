<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级智脑 · 企业经营导航首页</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e9edf2;
    --border:#e2e6ec; --border-2:#d3d9e2;
    --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
    --brand:#1e4fa3; --brand-soft:#e8f0fb; --brand-line:#bcd4f3;
    --indigo:#3b5ac7; --indigo-soft:#eef2ff;
    --evi:#0F6E56; --evi-soft:#e1f5ee; --evi-line:#9fe1cb;
    --warn:#b07416; --warn-soft:#faeedb; --warn-line:#f3d59a;
    --risk:#c62a2a; --risk-soft:#fbe9e9; --risk-line:#f4c2c2;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
    --shadow-2:0 6px 24px rgba(15,23,42,.08);
    --r:12px; --r-sm:8px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ===== 侧边导航 ===== */
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
  .brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#2f6fd0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .brand .name{font-size:15px;font-weight:700}
  .brand .sub{font-size:11px;color:var(--text-3);margin-top:1px}
  .nav{padding:10px 10px;flex:1;overflow:auto}
  .nav-group{font-size:11px;color:var(--text-3);padding:14px 12px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-2);cursor:pointer;font-size:13px;margin-bottom:2px;transition:.15s}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
  .nav-item .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;opacity:.85}
  .nav-item.active .ic{opacity:1}
  .side-foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
  .side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--evi);margin-right:6px;vertical-align:middle;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* ===== 顶部上下文栏 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .ctxbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 22px;flex-shrink:0}
  .ctx-item{display:flex;flex-direction:column;line-height:1.25}
  .ctx-item .k{font-size:10.5px;color:var(--text-3)}
  .ctx-item .v{font-size:13px;font-weight:700;color:var(--text)}
  .ctx-scope{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
  .ctx-scope:hover{background:var(--surface-3)}
  .ctx-chip{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--evi-soft);color:var(--evi);border:1px solid var(--evi-line);font-weight:700}
  .ctx-chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .ctx-bar-spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;width:260px;color:var(--text-3);font-size:13px}
  .evidence-btn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
  .evidence-btn:hover{background:var(--surface-2)}
  .user{display:flex;align-items:center;gap:10px}
  .user .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .ask-btn{display:flex;align-items:center;gap:7px;background:var(--brand-soft);color:var(--brand);border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .ask-btn:hover{background:var(--brand-line)}

  /* ===== 画布 ===== */
  .canvas{flex:1;overflow:auto;padding:22px 26px 100px}

  /* ===== 通用卡片 ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .card .ch{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .card .ch .sub{font-size:12px;color:var(--text-3);font-weight:400}
  .card .ch .right{display:flex;align-items:center;gap:10px}
  .card .cb{padding:18px}
  .grid{display:grid;gap:16px}
  .row{display:flex;gap:16px;flex-wrap:wrap}

  /* ===== 模块标题 ===== */
  .sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:14px}
  .sec-title .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}

  /* ===== 标签 ===== */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;border:1px solid transparent}
  .badge.brand{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
  .badge.evi{background:var(--evi-soft);color:var(--evi);border-color:var(--evi-line)}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .badge.risk{background:var(--risk-soft);color:var(--risk);border-color:var(--risk-line)}
  .badge.muted{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
  .tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}

  /* ===== 今日经营导航 ===== */
  .hero{border:1px solid var(--brand-line);background:linear-gradient(180deg,#fbfdff,#fff);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .hero .eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--brand);font-weight:700;margin-bottom:8px}
  .hero h2{font-size:20px;font-weight:700;margin-bottom:10px}
  .hero .lead{color:var(--text-2);font-size:13.5px;max-width:760px;line-height:1.7}
  .hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
  .hstat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .hstat .k{font-size:11.5px;color:var(--text-3);margin-bottom:5px}
  .hstat .v{font-size:22px;font-weight:700}
  .hstat .delta{font-size:12px;margin-top:4px;font-weight:700}
  .hstat .delta.up{color:var(--evi)}
  .hstat .delta.down{color:var(--risk)}
  .hstat .delta.neutral{color:var(--text-3)}
  .hmeta{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
  .hmeta .it{display:flex;gap:6px;align-items:center;color:var(--text-2);font-size:13px}
  .hmeta .it .lab{color:var(--text-3)}
  .hero-actions{display:flex;gap:12px;margin-top:18px;align-items:center}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:#1a4690}
  .btn.ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border-2)}
  .btn.ghost:hover{background:var(--surface-2)}
  .brain-signal{background:var(--indigo-soft);border:1px solid var(--brand-line);border-radius:10px;padding:13px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:14px}
  .brain-signal .ic{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .brain-signal .tx{font-size:13.5px;line-height:1.6}
  .brain-signal .tx b{color:var(--brand)}
  .suggest-next{display:flex;align-items:center;gap:12px;margin-top:12px}
  .suggest-next .arr{font-size:20px;color:var(--brand)}
  .suggest-next .tx{font-size:13.5px;color:var(--text-2);flex:1}

  /* ===== 等待决策 ===== */
  .decision-list{display:flex;flex-direction:column;gap:10px}
  .decitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;cursor:pointer;transition:.15s}
  .decitem:hover{border-color:var(--brand-line);background:#fbfdff}
  .decitem .num{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .decitem .body{flex:1;min-width:0}
  .decitem .t{font-size:13.5px;font-weight:700;margin-bottom:2px}
  .decitem .d{font-size:12px;color:var(--text-3)}
  .decitem .act{color:var(--brand);font-size:12px;font-weight:700;white-space:nowrap}

  /* ===== KPI 卡片 ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:.15s;position:relative}
  .kpi:hover{box-shadow:var(--shadow-2);border-color:var(--brand-line)}
  .kpi .qicon{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);cursor:help;transition:.15s}
  .kpi .qicon:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .kpi .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:6px}
  .kpi .v{font-size:30px;font-weight:700;line-height:1.1}
  .kpi .v .prefix{font-size:20px;font-weight:700;margin-right:2px}
  .kpi .v .unit{font-size:16px;font-weight:400;color:var(--text-2);margin-left:2px}
  .kpi .sub{font-size:12px;color:var(--text-2);margin-top:8px}
  .kpi .sub span{color:var(--text-3)}
  .kpi .goal{font-size:12px;color:var(--text-3);margin-top:8px}
  .kpi .bottom{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
  .kpi .bottom .delta{font-weight:700}
  .kpi .bottom .delta.up{color:var(--evi)}
  .kpi .bottom .delta.down{color:var(--risk)}
  .kpi .bottom .note{color:var(--text-3)}
  .kpi .bottom .divider{color:var(--border-2);margin:0 2px}

  /* KPI tooltip */
  .kpi-tooltip{position:absolute;z-index:100;background:rgba(15,23,42,.92);color:#fff;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.7;width:280px;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;transform:translateY(-8px)}
  .kpi-tooltip.show{opacity:1}
  .kpi-tooltip .tt{font-weight:700;font-size:13px;margin-bottom:8px}
  .kpi-tooltip .tl{color:#94a3b8;margin-top:8px}
  .kpi-tooltip .tv{color:#fff}

  /* ===== 图表 ===== */
  .chart-box{height:260px;width:100%;position:relative}
  .chart-box-sm{height:220px;width:100%}
  .chart-top-card{position:absolute;left:10px;top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;box-shadow:var(--shadow);z-index:5;font-size:12px}
  .chart-top-card .k{color:var(--text-3);margin-bottom:2px}
  .chart-top-card .v{font-weight:700;display:flex;align-items:center;gap:8px}
  .chart-footnote{font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.6}
  .chart-footnote strong{color:var(--text-2)}

  /* ===== 省份排名 ===== */
  .province-wrap{display:flex;flex-direction:column;gap:10px}
  .province-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  .province-head .smart-note{font-size:12px;color:var(--brand);line-height:1.6;text-align:right;max-width:220px}
  .province-head .smart-note .lab{color:var(--brand);font-weight:700}
  .rank-row{display:grid;grid-template-columns:30px 56px 1fr 70px 80px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .rank-row:last-child{border-bottom:none}
  .rank-row .idx{font-weight:700;color:var(--text-2)}
  .rank-row .prov{font-weight:700}
  .rank-row .gmv-col{display:flex;align-items:center;gap:10px}
  .rank-row .bar-wrap{flex:0 0 70px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .rank-row .bar-fill{height:100%;background:var(--brand);border-radius:4px}
  .rank-row .val{font-weight:700;white-space:nowrap;min-width:50px;text-align:right}
  .rank-row .stores{color:var(--text-3);text-align:right}
  .rank-row .avg{color:var(--text-2);text-align:right}
  .rank-head{display:grid;grid-template-columns:30px 56px 1fr 70px 80px;gap:10px;padding:0 0 8px;font-size:11px;color:var(--text-3);font-weight:600}
  .rank-head .gmv-head{padding-left:0}
  .focus-label{font-size:11px;color:var(--risk);font-weight:700;margin:8px 0 4px}
  .focus-row{display:grid;grid-template-columns:30px 56px 1fr 70px 80px;gap:10px;align-items:center;padding:8px 0;font-size:13px;background:var(--risk-soft);border-radius:8px;margin:4px 0}
  .focus-row .prov{font-weight:700}
  .focus-row .gmv-col{display:flex;align-items:center;gap:10px}
  .focus-row .bar-wrap{flex:0 0 70px;height:8px;background:#f4c2c2;border-radius:4px;overflow:hidden}
  .focus-row .bar-fill{height:100%;background:var(--risk);border-radius:4px}
  .focus-row .val{font-weight:700;white-space:nowrap;min-width:50px;text-align:right}
  .focus-row .stores{text-align:right;color:var(--text-3)}
  .focus-row .avg{text-align:right;font-weight:700;color:var(--risk)}
  .province-foot{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
  .province-foot .focus-label{margin:0}
  .prov-more-btn{border:1px solid var(--brand-line);background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.15s}
  .prov-more-btn:hover{background:var(--brand-line)}

  /* ===== 行动效果与目标 ===== */
  .effect-path{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:4px}
  .effect-step{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
  .effect-step .icn{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .effect-step .lab{font-size:11px;color:var(--text-3);font-weight:600}
  .effect-step .val{font-size:13px;font-weight:700;color:var(--text);line-height:1.5}
  .effect-step .val .sub{font-size:12px;color:var(--text-2);font-weight:400}
  .effect-arrow{display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:18px;padding:0 2px}
  .effect-note{font-size:13px;color:var(--text-2);line-height:1.7;margin-top:14px}
  .goal-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}
  .goal-row:last-child{border-bottom:none}
  .goal-row .name{font-size:13px;font-weight:700;width:110px}
  .goal-row .bar-bg{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;max-width:260px}
  .goal-row .bar-fill{height:100%;border-radius:5px}
  .goal-row .nums{font-size:12px;color:var(--text-2);width:150px;text-align:right}
  .goal-row .status{font-size:12px;font-weight:700;width:90px;text-align:right}

  /* ===== 导航队列 ===== */
  .queue-tabs{display:flex;gap:8px;margin-bottom:14px}
  .qtab{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--text-2);border:1px solid transparent}
  .qtab:hover{background:var(--surface-3)}
  .qtab.active{background:var(--brand-soft);color:var(--brand)}
  .queue-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .queue-table th{text-align:left;padding:10px 12px;color:var(--text-3);font-weight:600;font-size:11.5px;border-bottom:1px solid var(--border);white-space:nowrap}
  .queue-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
  .queue-table tr:hover{background:#fbfdff}
  .queue-table .pri{display:inline-block;width:6px;height:34px;border-radius:3px;background:var(--risk);vertical-align:middle;margin-right:8px}
  .queue-table .pri.mid{background:var(--warn)}
  .queue-table .pri.low{background:var(--text-3)}
  .queue-table .name{font-weight:700}
  .queue-table .meta{color:var(--text-3);font-size:11.5px;margin-top:3px}
  .queue-table .progress-bg{width:70px;height:6px;background:var(--surface-2);border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px}
  .queue-table .progress-fill{height:100%;background:var(--brand);border-radius:3px}

  /* ===== 轻量页 ===== */
  .light-page{max-width:900px}
  .light-page h1{font-size:22px;font-weight:700;margin-bottom:10px}
  .light-page .lead{color:var(--text-2);font-size:14px;line-height:1.7;margin-bottom:24px}

  /* ===== 底部说明 ===== */
  .page-foot{display:flex;gap:20px;margin-top:20px;font-size:11.5px;color:var(--text-3);align-items:center}
  .page-foot .update{display:flex;align-items:center;gap:6px}

  /* ===== 提示 ===== */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;z-index:90;pointer-events:none}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="kpi-tooltip" id="kpiTooltip"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 真实经营数据 ===================== */
const REAL = {
  org: "德联集团 / 全国",
  period: "近 30 天（2026-07-01 ~ 2026-07-31）",
  dataDate: "2026-08-14",
  dataConf: "高",
  comparePeriod: "2026年6月",
  cyclePeriod: "2026年7月",
  kpi: {
    payGMV: 222.9,
    payGMVMoM: 24,
    targetGMV: 129,
    hexiao: 78.5,
    hexiaoMoM: 6,
    hexiaoRate: 35,
    hexiaoRateMoM: -6,
    storeGMV: 79.1,
    storeGMVShare: 35,
    storeGMVShareMoM: 10,
    refundRate: 32,
    refundRateMoM: 3,
    refundMoney: 72.7,
    dailyDealStore: 108,
    dailyDealStoreMoM: 16,
    dailyDealStorePP: 1
  },
  // KPI 人话解释
  kpiTips: {
    '支付成交额': {
      human: '用户在抖音完成下单并支付的总金额，反映销售热度与营销转化能力。',
      formula: '支付成交额 = Σ 各门店页成交金额',
      example: '2026 年 7 月 Σ = 222.9 万元',
      scope: '按订单支付时间统计，含退款前金额。'
    },

        ${goalRow('支付成交额',REAL.kpi.payGMV,300,'万','#1e4fa3',-74)}
        ${goalRow('门店成交额占比',REAL.kpi.storeGMVShare,45,'%','#0F6E56',-10)}
      </div>
    </div>
  </div>
  ${queueModule()}
  <div class="page-foot">
    <span class="update"><span>🕐</span>数据更新：2026-08-07 10:00</span>
    <span>数据口径说明</span>
    <span>下次更新：2026-08-08 10:00</span>
  </div>`;
}

function goalRow(name,current,target,unit,color,diff){
  const pct = Math.min((current/target*100),100).toFixed(0);
  const diffText = diff < 0 ? `偏离 ${diff}${unit}` : `达成 +${diff}${unit}`;
  const diffColor = diff < 0 ? 'var(--risk)' : 'var(--evi)';
  return `<div class="goal-row">
    <div class="name">${name}</div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="nums">当前 ${current}${unit} · 目标 ${target}${unit}</div>
    <div class="status" style="color:${diffColor}">${diffText}</div>
  </div>`;
}

function queueModule(){
  const tabs = [
    {k:'all',n:'全部'},
    {k:'now',n:'立即处理 2'},
    {k:'nav',n:'导航中 5'},
    {k:'watch',n:'观察中 4'},
    {k:'summary',n:'周期汇总 8'}
  ];
  const tabHtml = tabs.map((t,i)=>`<span class="qtab ${i===0?'active':''}" onclick="toast('切换筛选：${t.n}')">${t.n}</span>`).join('');
  const rows = REAL.navQueue.map(q=>`<tr>
    <td><span class="pri ${q.pri==='hi'?'':q.pri==='mid'?'mid':'low'}"></span><span class="name">${q.name}</span><div class="meta">${q.signal}</div></td>
    <td>${q.range}</td>
    <td><span class="tag">${q.stage}</span></td>
    <td><div class="progress-bg"><div class="progress-fill" style="width:${q.rate==='—'?'0':q.rate}"></div></div>${q.rate}</td>
    <td>${q.next}</td>
    <td>${q.updated}</td>
  </tr>`).join('');
  return `<div style="margin-top:18px">
    <div class="sec-title"><span class="ic" style="background:var(--warn)">队</span>企业经营导航队列</div>
    <div class="card"><div class="ch"><span class="sub">按优先级与阶段持续跟踪</span></div>
      <div class="cb" style="padding:14px 18px">
        <div class="queue-tabs">${tabHtml}</div>
        <div style="overflow-x:auto">
          <table class="queue-table">
            <thead><tr><th>优先级 / 事项名称</th><th>影响范围</th><th>当前阶段</th><th>落地率</th><th>下一步建议</th><th>更新时间</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

/* ===== KPI tooltip 交互 ===== */
function bindKpiTooltips(){
  const tooltip = $('#kpiTooltip');
  document.querySelectorAll('.kpi .qicon').forEach(icon=>{
    icon.addEventListener('mouseenter',e=>{
      const name = icon.dataset.tip;
      const t = REAL.kpiTips[name];
      if(!t) return;
      tooltip.innerHTML = `<div class="tt">${name}</div>
        <div><b>人话解释：</b>${t.human}</div>
        <div class="tl"><b>公式：</b><span class="tv">${t.formula}</span></div>
        <div class="tl"><b>当前数字代入：</b><span class="tv">${t.example}</span></div>
        <div class="tl"><b>时间口径：</b><span class="tv">${t.scope}</span></div>`;
      tooltip.classList.add('show');
      positionTooltip(icon,tooltip);
    });
    icon.addEventListener('mouseleave',()=>{ tooltip.classList.remove('show'); });
  });
}
function positionTooltip(icon,tooltip){
  const rect = icon.getBoundingClientRect();
  const tRect = tooltip.getBoundingClientRect();
  let top = rect.top - tRect.height - 8;
  let left = rect.left + rect.width/2 - tRect.width/2;
  if(left < 10) left = 10;
  if(left + tRect.width > window.innerWidth - 10) left = window.innerWidth - tRect.width - 10;
  tooltip.style.top = top + 'px';
  tooltip.style.left = left + 'px';
}

/* ===== 交互 ===== */
function gotoPage(p){ currentPage=p; render(); window.scrollTo(0,0); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
window.addEventListener('resize',()=>{ chartInstances.forEach(c=>c.resize()); });

render();
</script>
